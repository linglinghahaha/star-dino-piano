<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>星龙工坊 · 童趣UI与动效设计实验室</title>
  <style>
    /* =========================================================================
       Base Reset & Stage-Locked Scaler (1194 x 834 iPad Pro 11")
       ========================================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #030712;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Top Switcher Control Bar */
    .style-control-bar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(10, 20, 36, 0.94);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .style-control-bar span {
      font-size: 13px;
      font-weight: 800;
      color: #ffdf7a;
      letter-spacing: 0.5px;
      margin-right: 4px;
    }
    .style-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .style-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .style-btn.active {
      background: linear-gradient(135deg, #ffd33d, #ff9f1c);
      color: #2b1700;
      border-color: #ffe685;
      box-shadow: 0 4px 14px rgba(255, 170, 0, 0.5);
      transform: scale(1.04);
    }
    .replay-anim-btn {
      background: rgba(56, 189, 248, 0.16);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-left: 6px;
    }
    .replay-anim-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }

    /* Stage Canvas */
    .stage-canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1194px;
      height: 834px;
      min-width: 1194px;
      min-height: 834px;
      background: url("assets/runtime/world-map-ipad-pro-11.webp") center / 100% 100% no-repeat;
      transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
      transform-origin: center center;
      overflow: hidden;
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.95);
    }

    /* Map Topbar inside stage */
    .map-topbar {
      position: absolute;
      top: 18px;
      left: 24px;
      right: 24px;
      z-index: 30;
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
    }
    .map-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px 6px 8px;
      background: linear-gradient(135deg, rgba(30, 144, 255, 0.8), rgba(0, 191, 255, 0.7));
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 24px rgba(0, 140, 255, 0.35);
      border-radius: 999px;
      backdrop-filter: blur(10px);
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .map-brand h1 {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .chapter-pill {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 250, 235, 0.95), rgba(245, 230, 190, 0.9));
      border: 2px solid #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      color: #6a4400;
      font-size: 15px;
      font-weight: 900;
    }
    .chapter-icon {
      color: #d97706;
      font-size: 13px;
    }
    .star-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }
    .star-pill span { color: #ffd13b; }
    .parent-gate {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    /* Garden rest button */
    .garden-rest-marker {
      position: absolute;
      right: 28px;
      bottom: 24px;
      height: 46px;
      padding: 6px 16px 6px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(13, 31, 56, 0.85);
      border: 1.5px solid rgba(111, 226, 237, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      color: #ffffff;
      z-index: 25;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .garden-rest-marker:hover {
      transform: scale(1.05);
    }
    .garden-rest-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #37dd8a, #1fb96e);
      color: #ffffff;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(31, 185, 110, 0.4);
    }
    .garden-rest-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
    }
    .garden-rest-copy strong {
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
    }
    .garden-rest-copy small {
      font-size: 10px;
      color: #92bce3;
      line-height: 1.1;
    }

    /* =========================================================================
       PRECISE GOLDEN ROAD LANDMARK COORDINATES
       ========================================================================= */
    .landmark-hub {
      position: absolute;
      z-index: 20;
      transform-origin: center center;
    }

    /* Station 1: Moon Workshop Platform (On the road & stone stairs) */
    .hub-1 {
      left: 70px;
      top: 410px;
    }

    /* Station 2: Central Neon DJ Disc Center (Exact center of disc) */
    .hub-2 {
      left: 520px;
      top: 535px;
      transform: translate(-50%, -50%);
    }

    /* Station 3: Greenhouse Dome Pathway (On road before flower dome) */
    .hub-3 {
      left: 840px;
      top: 510px;
      transform: translate(-50%, -50%);
    }

    /* Station 4: Crystal Archway Portal (At the base of glowing rock arch) */
    .hub-4 {
      left: 520px;
      top: 740px;
      transform: translate(-50%, -50%);
    }


    /* =========================================================================
       STYLE 1: 3D CREAMY CANDY TOY (3D 奶油糖果积木风 · 软萌童趣)
       ========================================================================= */
    body[data-style="candy"] .hub-active-card {
      background: linear-gradient(180deg, #ffffff 0%, #fffbf0 60%, #fff4d9 100%);
      border: 3.5px solid #ffde6b;
      border-radius: 32px;
      padding: 16px 20px 18px;
      box-shadow:
        0 8px 0 #e0aa26,
        0 18px 36px rgba(0, 0, 0, 0.45),
        inset 0 2px 0 rgba(255, 255, 255, 0.9);
      width: 400px;
      position: relative;
      animation: candyDropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes candyDropIn {
      0% { opacity: 0; transform: translateY(-30px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    body[data-style="candy"] .hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    body[data-style="candy"] .hub-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    body[data-style="candy"] .hub-badge {
      background: linear-gradient(135deg, #ff7b54, #ff5252);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: 0 3px 6px rgba(255, 82, 82, 0.4);
      letter-spacing: 0.5px;
    }
    body[data-style="candy"] .hub-title {
      font-size: 17px;
      font-weight: 950;
      color: #3b2812;
      line-height: 1.2;
    }
    body[data-style="candy"] .hub-subtitle {
      font-size: 12px;
      font-weight: 700;
      color: #8c6d48;
    }
    body[data-style="candy"] .hub-status-tag {
      background: #e8f8f0;
      color: #059669;
      border: 1.5px solid #a7f3d0;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }

    /* 3 Step Buttons inside Station 1 */
    body[data-style="candy"] .step-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 10px;
    }
    body[data-style="candy"] .step-btn {
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 0 #cbd5e1;
    }
    body[data-style="candy"] .step-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #cbd5e1;
    }
    body[data-style="candy"] .step-btn.active {
      background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
      border: 3px solid #f59e0b;
      box-shadow: 0 6px 0 #d97706, 0 10px 20px rgba(245, 158, 11, 0.3);
    }
    body[data-style="candy"] .step-btn.active:hover {
      transform: scale(1.04) translateY(-2px);
    }
    body[data-style="candy"] .step-mascot {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
      animation: candyBob 2s ease-in-out infinite alternate;
    }
    @keyframes candyBob {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-4px) rotate(2deg); }
    }
    body[data-style="candy"] .step-prop-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      opacity: 0.85;
    }
    body[data-style="candy"] .step-label {
      font-size: 12px;
      font-weight: 900;
      color: #334155;
      text-align: center;
      line-height: 1.15;
    }
    body[data-style="candy"] .step-btn.active .step-label {
      color: #92400e;
    }
    body[data-style="candy"] .play-trigger-badge {
      position: absolute;
      top: -8px;
      right: -6px;
      background: linear-gradient(135deg, #ffd33d, #ff9f1c);
      color: #451a03;
      border: 2px solid #ffffff;
      font-size: 10px;
      font-weight: 950;
      padding: 3px 8px;
      border-radius: 999px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      animation: pulsePlay 1.4s ease-in-out infinite alternate;
    }
    @keyframes pulsePlay {
      0% { transform: scale(1); }
      100% { transform: scale(1.12); }
    }

    /* Locked Stations in Candy Style */
    body[data-style="candy"] .locked-pill {
      background: linear-gradient(180deg, #ffffff, #fff7e8);
      border: 2.5px solid #ffd57a;
      border-radius: 999px;
      padding: 8px 18px 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 5px 0 #dfaa37, 0 10px 24px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body[data-style="candy"] .locked-pill:hover {
      transform: scale(1.08) translateY(-2px);
    }
    body[data-style="candy"] .locked-badge {
      background: #e2e8f0;
      color: #64748b;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
    }
    body[data-style="candy"] .locked-title {
      font-size: 14px;
      font-weight: 950;
      color: #3b2812;
    }
    body[data-style="candy"] .locked-tag {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
    }


    /* =========================================================================
       STYLE 2: STARRY HOLOGRAPHIC CAPSULE (星际流光太空舱 · 梦幻悬浮)
       ========================================================================= */
    body[data-style="starry"] .hub-active-card {
      background: rgba(14, 25, 48, 0.82);
      border: 2px solid rgba(110, 231, 255, 0.7);
      border-radius: 26px;
      padding: 16px 20px 18px;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.35),
        inset 0 0 15px rgba(56, 189, 248, 0.2),
        0 15px 35px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
      width: 400px;
      position: relative;
      animation: starryGlow 3s ease-in-out infinite alternate;
    }
    @keyframes starryGlow {
      0% { border-color: rgba(110, 231, 255, 0.6); box-shadow: 0 0 20px rgba(56, 189, 248, 0.25); }
      100% { border-color: rgba(244, 114, 182, 0.8); box-shadow: 0 0 35px rgba(244, 114, 182, 0.4); }
    }
    body[data-style="starry"] .hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    body[data-style="starry"] .hub-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    body[data-style="starry"] .hub-badge {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    body[data-style="starry"] .hub-title {
      font-size: 17px;
      font-weight: 950;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }
    body[data-style="starry"] .hub-subtitle {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }
    body[data-style="starry"] .hub-status-tag {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.3);
    }

    body[data-style="starry"] .step-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 10px;
    }
    body[data-style="starry"] .step-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.25s;
    }
    body[data-style="starry"] .step-btn.active {
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.1));
      border: 2px solid #fbbf24;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
    }
    body[data-style="starry"] .step-mascot {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
    }
    body[data-style="starry"] .step-prop-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      opacity: 0.6;
    }
    body[data-style="starry"] .step-label {
      font-size: 12px;
      font-weight: 900;
      color: #cbd5e1;
    }
    body[data-style="starry"] .step-btn.active .step-label {
      color: #fef08a;
    }
    body[data-style="starry"] .play-trigger-badge {
      position: absolute;
      top: -8px;
      right: -6px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      border: 1.5px solid #fff;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
      animation: pulsePlay 1.4s ease-in-out infinite alternate;
    }

    body[data-style="starry"] .locked-pill {
      background: rgba(15, 23, 42, 0.78);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 8px 18px 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.25s;
    }
    body[data-style="starry"] .locked-pill:hover {
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transform: scale(1.05);
    }
    body[data-style="starry"] .locked-badge {
      background: rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
    }
    body[data-style="starry"] .locked-title {
      font-size: 14px;
      font-weight: 900;
      color: #e2e8f0;
    }
    body[data-style="starry"] .locked-tag {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
    }


    /* =========================================================================
       STYLE 3: SLIDING ACCORDION DRAWER (滑动手风琴冒险抽屉 · 极简开阔)
       ========================================================================= */
    body[data-style="drawer"] .landmark-pin {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd33d, #ff9f1c);
      border: 3.5px solid #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 170, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    body[data-style="drawer"] .landmark-pin:hover {
      transform: scale(1.15) translateY(-3px);
    }
    body[data-style="drawer"] .landmark-pin span {
      font-size: 11px;
      font-weight: 950;
      color: #532301;
      line-height: 1;
    }
    body[data-style="drawer"] .landmark-pin strong {
      font-size: 16px;
      font-weight: 950;
      color: #532301;
      line-height: 1;
    }

    body[data-style="drawer"] .drawer-tray {
      position: absolute;
      left: 70px;
      top: -10px;
      background: rgba(255, 255, 255, 0.94);
      border: 3px solid #ffcb45;
      border-radius: 28px;
      padding: 14px 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(16px);
      transform-origin: left center;
      animation: drawerSlide 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes drawerSlide {
      0% { opacity: 0; transform: scaleX(0.4) translateX(-30px); }
      100% { opacity: 1; transform: scaleX(1) translateX(0); }
    }
    body[data-style="drawer"] .drawer-title {
      font-size: 15px;
      font-weight: 950;
      color: #3b2812;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    body[data-style="drawer"] .drawer-title small {
      font-size: 11px;
      color: #b45309;
      font-weight: 800;
    }
    body[data-style="drawer"] .drawer-steps {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 8px;
    }
    body[data-style="drawer"] .drawer-step-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    body[data-style="drawer"] .drawer-step-btn.active {
      background: #fef3c7;
      border-color: #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    }
    body[data-style="drawer"] .drawer-step-btn span {
      font-size: 11px;
      font-weight: 900;
      color: #334155;
    }
    body[data-style="drawer"] .drawer-step-btn.active span {
      color: #92400e;
    }

    body[data-style="drawer"] .locked-pin {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }
    body[data-style="drawer"] .locked-pin:hover {
      transform: scale(1.1);
      border-color: #ffd33d;
    }
    body[data-style="drawer"] .locked-pin span {
      font-size: 9px;
      font-weight: 800;
      color: #94a3b8;
    }
    body[data-style="drawer"] .locked-pin strong {
      font-size: 14px;
      font-weight: 900;
      color: #f1f5f9;
    }
    body[data-style="drawer"] .pin-label-tag {
      position: absolute;
      top: 54px;
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      pointer-events: none;
    }

    /* Modal / Feedback hint */
    .hint-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .hint-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body data-style="candy">

  <!-- Top Multi-Style Control Bar -->
  <nav class="style-control-bar">
    <span>🎨 视觉风格切换：</span>
    <button class="style-btn active" data-target="candy" type="button">
      🍓 风格1：3D奶油糖果玩具 (推荐)
    </button>
    <button class="style-btn" data-target="starry" type="button">
      🌌 风格2：星际流光太空舱
    </button>
    <button class="style-btn" data-target="drawer" type="button">
      🪄 风格3：滑动冒险抽屉
    </button>
    <button class="replay-anim-btn" id="replayBtn" type="button">
      ↻ 重播动画
    </button>
  </nav>

  <!-- iPad Pro 11" Stage Canvas (1194 x 834) -->
  <main class="stage-canvas" id="stageCanvas">
    <!-- Top Progress Bar -->
    <header class="map-topbar">
      <div class="map-brand">
        <img class="brand-icon" src="assets/runtime/app-icon.webp" alt="星龙工坊">
        <h1>星龙工坊</h1>
      </div>
      <div class="chapter-pill">
        <span class="chapter-icon">◆</span>
        <strong>月球基地 · 第一章</strong>
      </div>
      <div class="star-pill">
        <span>★</span>
        <strong>进行中 · 第 1/10 关</strong>
      </div>
      <button class="parent-gate" type="button" title="家长区">⚙</button>
    </header>

    <!-- LANDMARK 1: Moon Base Workshop (Left platform, on golden road & steps) -->
    <section class="landmark-hub hub-1" id="hub1">
      <!-- Style 1 & 2 Active Card -->
      <div class="hub-active-card" id="cardHub1">
        <div class="hub-header">
          <div class="hub-title-box">
            <span class="hub-badge">阶段 01</span>
            <div>
              <div class="hub-title">起步地基</div>
              <div class="hub-subtitle">认识 C-D-E 琴键</div>
            </div>
          </div>
          <span class="hub-status-tag">进行中</span>
        </div>

        <div class="step-row">
          <div class="step-btn active" id="step1">
            <span class="play-trigger-badge">出发 ▶</span>
            <img class="step-mascot" src="assets/runtime/xingya-suit-point.webp" alt="星芽">
            <span class="step-label">铺第一块月亮地板</span>
          </div>
          <div class="step-btn" id="step2">
            <img class="step-prop-icon" src="assets/runtime/part-light.webp" alt="小灯">
            <span class="step-label">小灯醒醒</span>
          </div>
          <div class="step-btn" id="step3">
            <img class="step-prop-icon" src="assets/runtime/part-wheel.webp" alt="车轮">
            <span class="step-label">听车轮</span>
          </div>
        </div>
      </div>

      <!-- Style 3 Pin & Drawer -->
      <div class="style-3-wrapper" id="drawerHub1" style="display: none;">
        <div class="landmark-pin" id="pin1">
          <span>阶段</span>
          <strong>01</strong>
        </div>
        <div class="drawer-tray">
          <div class="drawer-title">
            <strong>起步地基 · 先认识 C-D-E</strong>
            <small>进行中</small>
          </div>
          <div class="drawer-steps">
            <div class="drawer-step-btn active">
              <img src="assets/runtime/xingya-suit-point.webp" style="width: 30px; height: 30px; object-fit: contain;">
              <span>1 铺地板 ▶</span>
            </div>
            <div class="drawer-step-btn">
              <img src="assets/runtime/part-light.webp" style="width: 24px; height: 24px; object-fit: contain;">
              <span>2 小灯</span>
            </div>
            <div class="drawer-step-btn">
              <img src="assets/runtime/part-wheel.webp" style="width: 24px; height: 24px; object-fit: contain;">
              <span>3 车轮</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- LANDMARK 2: Central Neon Musical Disc (Center of the glowing platform) -->
    <section class="landmark-hub hub-2" id="hub2">
      <div class="locked-pill" id="cardHub2">
        <span class="locked-badge">阶段 02</span>
        <strong class="locked-title">工坊装配</strong>
        <span class="locked-tag">待解锁</span>
      </div>
      <div class="locked-pin-wrapper" id="drawerHub2" style="display: none;">
        <div class="locked-pin">
          <span>阶段</span>
          <strong>02</strong>
        </div>
        <span class="pin-label-tag">工坊装配</span>
      </div>
    </section>

    <!-- LANDMARK 3: Botanical Greenhouse Dome (Right Terrace entrance) -->
    <section class="landmark-hub hub-3" id="hub3">
      <div class="locked-pill" id="cardHub3">
        <span class="locked-badge">阶段 03</span>
        <strong class="locked-title">合上屋顶</strong>
        <span class="locked-tag">待解锁</span>
      </div>
      <div class="locked-pin-wrapper" id="drawerHub3" style="display: none;">
        <div class="locked-pin">
          <span>阶段</span>
          <strong>03</strong>
        </div>
        <span class="pin-label-tag">合上屋顶</span>
      </div>
    </section>

    <!-- LANDMARK 4: Underground Crystal Archway (Bottom Cavern Portal) -->
    <section class="landmark-hub hub-4" id="hub4">
      <div class="locked-pill" id="cardHub4">
        <span class="locked-badge">阶段 04</span>
        <strong class="locked-title">星图启航</strong>
        <span class="locked-tag">待解锁</span>
      </div>
      <div class="locked-pin-wrapper" id="drawerHub4" style="display: none;">
        <div class="locked-pin">
          <span>阶段</span>
          <strong>04</strong>
        </div>
        <span class="pin-label-tag">星图启航</span>
      </div>
    </section>

    <!-- Garden Capsule -->
    <aside class="garden-rest-marker" id="gardenBtn">
      <span class="garden-rest-icon">✦</span>
      <div class="garden-rest-copy">
        <strong>花园入口</strong>
        <small>点这里走进秘密花园</small>
      </div>
    </aside>
  </main>

  <div class="hint-toast" id="hintToast">已切换风格</div>

  <script>
    // Responsive Stage Scaler (Locked to 1194 x 834)
    function updateStageScale() {
      var s = Math.min(window.innerWidth / 1194, window.innerHeight / 834);
      document.documentElement.style.setProperty('--stage-scale', s);
    }
    window.addEventListener('resize', updateStageScale);
    window.addEventListener('orientationchange', updateStageScale);
    updateStageScale();

    // Style Switcher Logic
    var btns = document.querySelectorAll('.style-btn');
    var toast = document.getElementById('hintToast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 1800);
    }

    btns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        btns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var style = btn.getAttribute('data-target');
        document.body.setAttribute('data-style', style);

        // Toggle elements for Style 3 Drawer vs 1/2 Cards
        var isDrawer = (style === 'drawer');
        document.getElementById('cardHub1').style.display = isDrawer ? 'none' : 'block';
        document.getElementById('drawerHub1').style.display = isDrawer ? 'block' : 'none';

        ['2', '3', '4'].forEach(function(id) {
          document.getElementById('cardHub' + id).style.display = isDrawer ? 'none' : 'inline-flex';
          document.getElementById('drawerHub' + id).style.display = isDrawer ? 'flex' : 'none';
        });

        var names = {
          candy: '已切换至：风格1【3D奶油糖果玩具风】',
          starry: '已切换至：风格2【星际流光太空舱风】',
          drawer: '已切换至：风格3【滑动冒险手风琴抽屉风】'
        };
        showToast(names[style] || '风格切换成功');
      });
    });

    // Replay Animation
    document.getElementById('replayBtn').addEventListener('click', function() {
      var card = document.getElementById('cardHub1');
      card.style.animation = 'none';
      card.offsetHeight; // trigger reflow
      var style = document.body.getAttribute('data-style');
      if (style === 'candy') {
        card.style.animation = 'candyDropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
      } else if (style === 'starry') {
        card.style.animation = 'starryGlow 3s ease-in-out infinite alternate';
      }
      showToast('已重新触发入场弹跳动效');
    });

    // Interactive button clicks
    document.getElementById('step1').addEventListener('click', function() {
      showToast('点击了：第 1 关【铺第一块月亮地板】');
    });
    document.getElementById('step2').addEventListener('click', function() {
      showToast('第 2 关【小灯醒醒】需要先通关第 1 关哦');
    });
    document.getElementById('step3').addEventListener('click', function() {
      showToast('第 3 关【听车轮】暂未开启');
    });
    ['cardHub2', 'cardHub3', 'cardHub4', 'drawerHub2', 'drawerHub3', 'drawerHub4'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('click', function() {
          showToast('该阶段尚未解锁，请先完成【起步地基】！');
        });
      }
    });
  </script>
</body>
</html>
